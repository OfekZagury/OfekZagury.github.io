<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ofek Zagury · Portfolio</title>
    <meta
      name="description"
      content="Ofek Zagury, Software Engineer (AI &amp; Backend). Multi-agent AI systems, Python and TypeScript backends, computer vision and React apps."
    />
    <meta property="og:title" content="Ofek Zagury · Portfolio" />
    <meta
      property="og:description"
      content="Software Engineer (AI &amp; Backend). Multi-agent AI systems, Python and TypeScript backends, computer vision and React apps."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a1627" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = prefersDark;
        try {
          var saved = localStorage.getItem("theme");
          if (saved) dark = saved === "dark";
        } catch (e) {}
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body class="bg-ivory text-navy-950 antialiased dark:bg-navy-950 dark:text-ivory">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
